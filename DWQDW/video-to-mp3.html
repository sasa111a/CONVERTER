<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео в MP3 — конвертер</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --text: #eaeaf0;
    --muted: #8a8fa3;
    --border: #2a2e3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% 10%, #1b1e2b 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .dropzone.drag {
    border-color: var(--accent);
    background: rgba(108,92,231,0.08);
  }
  .dropzone svg { width: 36px; height: 36px; margin-bottom: 10px; color: var(--muted); }
  .dropzone .main { font-size: 15px; margin-bottom: 4px; }
  .dropzone .hint { font-size: 12px; color: var(--muted); }
  input[type=file] { display: none; }

  .file-info {
    margin-top: 18px;
    padding: 12px 14px;
    background: #1d212c;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .file-info.show { display: flex; }
  .file-info .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-info .size { color: var(--muted); flex-shrink: 0; }

  .format-toggle {
    margin-top: 18px;
    display: flex;
    gap: 8px;
    background: #1d212c;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }
  .format-toggle button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .format-toggle button.active {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white;
  }

  button.convert {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  button.convert:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.convert:not(:disabled):active { transform: scale(0.98); }

  .progress-wrap {
    margin-top: 18px;
    display: none;
  }
  .progress-wrap.show { display: block; }
  .progress-bar {
    height: 8px;
    border-radius: 4px;
    background: #1d212c;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .2s;
  }
  .progress-label {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  .result {
    margin-top: 18px;
    display: none;
    text-align: center;
  }
  .result.show { display: block; }
  .result a {
    display: inline-block;
    padding: 12px 22px;
    background: #1d212c;
    border: 1px solid var(--accent2);
    color: var(--accent2);
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
  }

  .error {
    margin-top: 14px;
    color: #ff7675;
    font-size: 13px;
    display: none;
    text-align: center;
  }
  .error.show { display: block; }

  footer {
    margin-top: 24px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Видео → MP3 / MP4</h1>
  <p class="sub">Конвертация происходит прямо в браузере. Файлы никуда не загружаются.</p>

  <div class="dropzone" id="dropzone">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="main">Перетащите видео сюда или нажмите, чтобы выбрать</div>
    <div class="hint">MP4, MOV, AVI, MKV, WEBM и другие форматы</div>
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div class="file-info" id="fileInfo">
    <span class="name" id="fileName"></span>
    <span class="size" id="fileSize"></span>
  </div>

  <div class="format-toggle">
    <button type="button" id="fmtMp3" class="active">В MP3 (звук)</button>
    <button type="button" id="fmtMp4">В MP4 (видео)</button>
  </div>

  <button class="convert" id="convertBtn" disabled>Конвертировать в MP3</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Загрузка конвертера…</div>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="result" id="result">
    <a id="downloadLink" download>Скачать файл</a>
  </div>

  <footer>Работает на ffmpeg.wasm. Большие файлы могут занять время — не закрывайте вкладку.</footer>
</div>

<script type="module">
import { FFmpeg } from './vendor/ffmpeg/index.js';
import { fetchFile, toBlobURL } from './vendor/util/index.js';

const ffmpeg = new FFmpeg();

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const convertBtn = document.getElementById('convertBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const result = document.getElementById('result');
const downloadLink = document.getElementById('downloadLink');
const errorBox = document.getElementById('errorBox');
const fmtMp3Btn = document.getElementById('fmtMp3');
const fmtMp4Btn = document.getElementById('fmtMp4');

let selectedFile = null;
let ffmpegLoaded = false;
let targetFormat = 'mp3';

function updateConvertLabel() {
  convertBtn.textContent = 'Конвертировать в ' + targetFormat.toUpperCase();
}

fmtMp3Btn.addEventListener('click', () => {
  targetFormat = 'mp3';
  fmtMp3Btn.classList.add('active');
  fmtMp4Btn.classList.remove('active');
  updateConvertLabel();
});
fmtMp4Btn.addEventListener('click', () => {
  targetFormat = 'mp4';
  fmtMp4Btn.classList.add('active');
  fmtMp3Btn.classList.remove('active');
  updateConvertLabel();
});

function formatSize(bytes) {
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}
function clearError() {
  errorBox.classList.remove('show');
  errorBox.textContent = '';
}

dropzone.addEventListener('click', () => fileInput.click());

['dragenter','dragover'].forEach(evt =>
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    dropzone.classList.add('drag');
  })
);
['dragleave','drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
  })
);
dropzone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) handleFile(file);
});

function handleFile(file) {
  if (!file.type.startsWith('video/')) {
    showError('Пожалуйста, выберите видеофайл.');
    return;
  }
  clearError();
  selectedFile = file;
  fileName.textContent = file.name;
  fileSize.textContent = formatSize(file.size);
  fileInfo.classList.add('show');
  convertBtn.disabled = false;
  result.classList.remove('show');
}

convertBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  clearError();
  convertBtn.disabled = true;
  progressWrap.classList.add('show');
  result.classList.remove('show');
  progressFill.style.width = '0%';

  try {
    if (!ffmpegLoaded) {
      progressLabel.textContent = 'Загрузка конвертера (один раз)…';
      const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
      await ffmpeg.load({
        coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
      });
      ffmpegLoaded = true;
    }

    ffmpeg.on('progress', ({ progress }) => {
      const pct = Math.min(100, Math.max(0, Math.round((progress || 0) * 100)));
      progressFill.style.width = pct + '%';
      progressLabel.textContent = 'Конвертация… ' + pct + '%';
    });

    progressLabel.textContent = 'Чтение файла…';
    const inputName = 'input' + (selectedFile.name.match(/\.[^.]+$/)?.[0] || '.mp4');
    const isMp3 = targetFormat === 'mp3';
    const outputName = isMp3 ? 'output.mp3' : 'output.mp4';

    await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

    progressLabel.textContent = 'Конвертация…';
    if (isMp3) {
      await ffmpeg.exec(['-i', inputName, '-vn', '-ar', '44100', '-ac', '2', '-b:a', '192k', outputName]);
    } else {
      await ffmpeg.exec(['-i', inputName, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '23', '-c:a', 'aac', '-b:a', '192k', '-movflags', '+faststart', outputName]);
    }

    const data = await ffmpeg.readFile(outputName);
    const blob = new Blob([data.buffer], { type: isMp3 ? 'audio/mpeg' : 'video/mp4' });
    const url = URL.createObjectURL(blob);

    const baseName = selectedFile.name.replace(/\.[^.]+$/, '');
    downloadLink.href = url;
    downloadLink.download = baseName + (isMp3 ? '.mp3' : '.mp4');

    await ffmpeg.deleteFile(inputName);
    await ffmpeg.deleteFile(outputName);

    progressLabel.textContent = 'Готово!';
    progressFill.style.width = '100%';
    result.classList.add('show');
  } catch (err) {
    console.error(err);
    showError('Ошибка конвертации: ' + (err.message || err));
    progressWrap.classList.remove('show');
  } finally {
    convertBtn.disabled = false;
  }
});
</script>

</body>
</html>
